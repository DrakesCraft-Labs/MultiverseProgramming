# ===================================================================== #
#                   MultiverseProgramming Configuration                 #
# ===================================================================== #

# Block that acts as a standard computer (right-click opens the GUI).
# Must be a valid placeable block and item (e.g. LECTERN, CRAFTING_TABLE, NOTE_BLOCK).
computer-block: LECTERN

# Maximum execution time of a program on a standard computer, in milliseconds.
# Prevents long or infinite loops from hanging threads. Default: 3000 ms.
execution-timeout-ms: 3000

# Block that acts as an advanced computer.
# Loops and long-running programs can run here. Keeps the disk inside when closed.
# Must be different from computer-block (e.g. ENCHANTING_TABLE, OBSERVER, LODESTONE).
advanced-computer-block: ENCHANTING_TABLE

# Maximum execution time of a program on an advanced computer, in milliseconds.
# Use 0 for no limit.
advanced-execution-timeout-ms: 0

# Maximum number of lines that a program can print or stream before execution is stopped.
# Protects server chat and memory from runaway print loops.
max-stream-lines: 10000

# Minimum delay in milliseconds between button presses per player to prevent spamming.
prevent-spam-delay-ms: 500

# If true, when an advanced computer is broken or exploded, any disk inside drops naturally.
drop-disks-on-break: true

# ===================================================================== #
#                   Machine Crafting Recipes Toggles                    #
# ===================================================================== #
# Toggle crafting recipes individually for each machine and component.
enable-computer-recipe: true
enable-advanced-computer-recipe: true
enable-turtle-recipe: true
enable-crafter-recipe: true
enable-monitor-recipe: true
enable-speaker-recipe: true
enable-transposer-recipe: true
enable-disk-recipe: true
enable-recipe-scanner: true
enable-recipe-cartographer: true
enable-recipe-alchemist: true
enable-recipe-farmer: true
enable-recipe-quarry: true
enable-recipe-npc: true

# ===================================================================== #
#                   Machine Functionality Toggles                       #
# ===================================================================== #
# Toggle whether each machine type can be placed, opened, and executed.
enable-computer: true
enable-advanced-computer: true
enable-turtle: true
enable-crafter: true
enable-monitor: true
enable-speaker: true
enable-transposer: true
enable-scanner: true
enable-cartographer: true
enable-alchemist: true
enable-farmer: true
enable-quarry: true
enable-npc: true

# ===================================================================== #
#                   Region Protection & Security                        #
# ===================================================================== #
# If true, only the strictly verified OWNER of a ProtectionStones claim can
# order a Turtle to build inside. Members will be blocked from building.
# Default is false (both owners and members can build inside their claims).
protection-stones-require-owner: false

# Check WorldGuard regions so Turtles cannot grief, raid, or build inside
# claims unless the turtle owner has building permissions in the region.
worldguard-protection-check: true

# ===================================================================== #
#                   Peripherals & Additional Machines                  #
# ===================================================================== #

# Block that acts as a Display Monitor (adjacent to computer).
# Displays text in the world using a floating TextDisplay entity.
monitor-block: OCHRE_FROGLIGHT

# Block that acts as an Auto-Crafter (adjacent to computer).
# Minecraft 1.21 native Crafter block.
crafter-block: CRAFTER

# Block that acts as an Inventory Transposer (adjacent to computer).
# Moves and filters items between adjacent containers.
transposer-block: HOPPER

# Block that acts as a Sound Synthesizer / Speaker (adjacent to computer).
# Plays notes, frequencies, and Minecraft sound effects.
speaker-block: NOTE_BLOCK

# Block that acts as an Entity and Block Scanner.
scanner-block: OBSERVER

# Block that acts as a Cartographer and Map Renderer.
cartographer-block: CARTOGRAPHY_TABLE

# Block that acts as an Alchemical Synthesizer (Potion Brewing).
alchemist-block: BREWING_STAND

# Block that acts as a Farming and Harvesting Attachment.
farmer-block: COMPOSTER

# Block that acts as the Turtle Quarry Engine Upgrade (placed laterally next to a turtle).
# Note: The Quarry Engine exclusively functions when attached to a Turtle (via turtle.quarry).
quarry-block: BLAST_FURNACE

# Block that acts as an Interactive NPC Dialogue Core.
npc-block: SCULK_CATALYST

# Maximum worker threads for running Lua scripts concurrently.
# Protects the server from thread exhaustion when many computers run simultaneously.
max-concurrent-programs: 8

# Maximum CPU instruction quota before a program is forced to yield or sleep.
# For advanced computers, programs auto-pause for 2 ms after this many instructions without sleep().
max-instructions-per-slice: 1000000

# ===================================================================== #
#                   Programmable Turtle & Construction                  #
# ===================================================================== #

# Block that acts as a Turtle (robotic mobile computer & builder).
# Default: DISPENSER.
turtle-block: DISPENSER

# Ticks between placing each block when building a blueprint.
# 2 ticks = 10 blocks/sec (smooth and lag-free). Min 1, Max 100.
turtle-build-delay-ticks: 2

# If true, the turtle must have the required blocks in its 16 inventory slots.
# If false, the turtle builds freely without consuming inventory items.
turtle-require-materials: false

# If true, moving and digging requires fuel (coal, blaze rods, lava).
turtle-fuel-required: false

# ===================================================================== #
#                   Web Portal & Blueprint Dashboard                    #
# ===================================================================== #

# Enable the built-in HTTP Web Portal for uploading .litematic & .nbt blueprints,
# 3D/layer visualizer, and live Turtle coordinate dispatch.
web-portal-enabled: true

# Port for the web dashboard.
web-portal-port: 8080

# Bind IP address (0.0.0.0 binds to all interfaces, 127.0.0.1 for local only).
web-portal-bind-address: "0.0.0.0"

# Public URL displayed to players with /pc web.
# By default, points to the official Web Dashboard hosted on GitHub Pages:
# https://drakescraft-labs.github.io/MultiverseProgramming/
# Players can open this link directly without port forwarding or manual setup.
web-portal-public-url: "https://drakescraft-labs.github.io/MultiverseProgramming/"

# ===================================================================== #
#                   Blueprint Security & Storage Quotas                 #
# ===================================================================== #

# Maximum storage in megabytes (MB) allowed per player for uploaded blueprints.
blueprint-player-quota-mb: 15.0

# Maximum file size in MB for a single uploaded blueprint.
blueprint-max-file-size-mb: 10.0

# Sanity limit for blueprint dimensions (maximum width/height/length in blocks).
blueprint-max-dimension: 512

# Maximum non-air blocks allowed in a single blueprint to prevent memory crashes.
blueprint-max-blocks: 250000

# Strip dangerous / illegal blocks (Bedrock, Command Blocks, End Portals, Nether Portals, Barriers, etc.)
# and replace them with AIR to protect survival worlds from malicious blueprints.
blueprint-filter-dangerous-blocks: true

# Automatic cleanup retention in days for unused blueprints (0 to disable).
blueprint-retention-days: 30