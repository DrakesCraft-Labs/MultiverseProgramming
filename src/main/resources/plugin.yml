name: MultiverseProgramming
version: ${project.version}
main: com.multiverse.programming.MultiverseProgrammingPlugin
api-version: '1.21'
description: Programmable computers with Lua, turtles, and blueprints.

commands:
  mvprog:
    description: Main MultiverseProgramming command for computers, turtles, and blueprints.
    aliases: [pc, mvp, computador, computadora, disco]
    usage: /mvprog <help|web|get|getbypass|quota|bp|build|give|reload>
    permission: multiverseprogramming.use

permissions:
  multiverseprogramming.use:
    description: Allows using computers, web portal, downloading blueprints and checking quota
    default: true
  multiverseprogramming.admin:
    description: Full administrative access (bypass, give, reload, build, purge, view others' quotas)
    default: op