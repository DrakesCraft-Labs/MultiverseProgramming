name: MultiverseProgramming
version: 1.0.0
main: com.multiverse.programming.MultiverseProgrammingPlugin
api-version: '1.21'
description: Programmable computers with Lua and floppy disks.

commands:
  pc:
    description: Computer and floppy disks
    aliases: [computador, computadora, disco]
    usage: /pc <run|give|help>

permissions:
  multiverseprogramming.use:
    description: Allows using computers
    default: true
  multiverseprogramming.admin:
    description: Allows giving custom items
    default: op